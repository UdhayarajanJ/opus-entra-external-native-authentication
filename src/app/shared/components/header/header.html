<header class="app-header">
    <div class="header-left">
        <a class="brand" routerLink="/" aria-label="Opus home">
            <span class="brand-logo" aria-hidden="true">
                <svg viewBox="0 0 40 40" fill="none">
                    <rect width="40" height="40" rx="11" fill="currentColor" opacity="0.1" />
                    <path d="M20 8L30 14V26L20 32L10 26V14L20 8Z" stroke="currentColor" stroke-width="2"
                        stroke-linejoin="round" />
                    <circle cx="20" cy="20" r="5" fill="currentColor" />
                </svg>
            </span>

            <span class="brand-name">Opus<span class="brand-dot">.</span></span>
        </a>

        <span class="header-divider"></span>

        <span class="workspace-label">Workspace</span>
    </div>

    <div class="header-right">
        <div class="user-info">
            <span class="user-name">{{userName()}}</span>
            <span class="user-email">{{userEmail()}}</span>
        </div>

        <span class="profile-avatar">
            U
        </span>

        <button type="button" class="logout-button" (click)="logout()">

            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"
                stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M10 17l5-5-5-5" />
                <path d="M15 12H3" />
                <path d="M12 3h6a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-6" />
            </svg>

            <span>Sign out</span>
        </button>
    </div>
</header>
