<main class="not-found-container">
    <section class="not-found-card">
        <div class="error-illustration" aria-hidden="true">
            <svg viewBox="0 0 120 100" fill="none">
                <path d="M18 75h84" stroke="#dce8eb" stroke-width="2" stroke-linecap="round" />
                <rect x="32" y="17" width="56" height="64" rx="10" fill="#e8f4f3" stroke="#176b73" stroke-width="2" />
                <path d="M44 36h32M44 46h23" stroke="#176b73" stroke-width="3" stroke-linecap="round" />
                <circle cx="76" cy="65" r="13" fill="#fff" stroke="#176b73" stroke-width="2" />
                <path d="M71 60l10 10m0-10L71 70" stroke="#176b73" stroke-width="2.5" stroke-linecap="round" />
                <circle cx="25" cy="25" r="4" fill="#e8c98a" />
                <circle cx="96" cy="39" r="3" fill="#e8c98a" />
            </svg>
        </div>

        <p class="error-code">ERROR 404</p>
        <h1>Page not found</h1>
        <p class="error-description">
            The page you're looking for doesn't exist, may have been moved,
            or the URL may be incorrect.
        </p>

        <div class="error-actions">
            <a routerLink="/" class="home-button">
                <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                    <path d="M3 10.5L12 3l9 7.5V21H3V10.5Z" stroke="currentColor" stroke-width="1.8"
                        stroke-linejoin="round" />
                    <path d="M9 21v-7h6v7" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" />
                </svg>
                Back to home
            </a>

            <button type="button" class="back-button" (click)="goBack()">
                Go back
            </button>
        </div>

        <div class="support-note">
            <span class="support-dot"></span>
            <span>Opus workspace</span>
        </div>
    </section>
</main>
